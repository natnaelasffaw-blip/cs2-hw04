<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>

    <style>
        .board {
            width: 330px;
        }

        .square {
            width: 100px;
            height: 100px;
            margin: 5px;
            background-color: lightblue;
            float: left;
            font-size: 70px;
            text-align: center;
            line-height: 100px;
        }

        .square:hover {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <div class="board">
        <div class="square">X</div>
        <div class="square"></div>
        <div class="square">O</div>

        <div class="square"></div>
        <div class="square">X</div>
        <div class="square"></div>

        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
    </div>

</body>
</html>
