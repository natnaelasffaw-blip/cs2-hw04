<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>

    <style>
        .board {
            width: 330px;
        }

        .square {
            width: 100px;
            height: 100px;
            margin: 5px;
            background-color: lightblue;
            float: left;
            font-size: 70px;
            text-align: center;
            line-height: 100px;
        }

        .square:hover {
            background-color: lightgray;
        }

        #turn {
            border: 1px solid black;
            width: 320px;
            padding: 5px;
            margin-bottom: 10px;
        }

        #winner {
            border: 1px solid black;
            width: 320px;
            padding: 5px;
            clear: both;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <div id="turn">X's Turn</div>

    <div class="board">

        <script>
            const NUM_SQUARES = 9;
            for (i=0; i<NUM_SQUARES; i++)
            {
                id = "sq"+i;
                document.write( "<div class='square' id='" + id + "'></div>" );
            }
        </script>

    </div>

    <div id="winner">Winner will show here</div>

    <script>
        document.getElementById("sq2").innerHTML = "X";
        document.getElementById("sq3").innerHTML = "O";
    </script>

</body>
</html>
